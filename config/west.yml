manifest:
  defaults:
    revision: v0.3
  remotes:
    #- name: zmkfirmware
     # url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
    - name: cantruchd #new entry
      url-base: https://github.com/cantruchd #new entry
    # - name: pbogut #new entry
    #   url-base: https://github.com/pbogut #new entry
  projects:
    - name: zmk
      #remote: zmkfirmware
      remote: cantruchd
      import: app/west.yml
      revision: mainfromzmk #new entry
      # 2. KHAI BÁO MODULE WIDGET CUSTOM CỦA BẠN (QUAN TRỌNG NHẤT)
    # Tên của project này KHÔNG CẦN phải có remote, vì nó nằm cục bộ trong thư mục 'app/'
    - name: nice_view_custom_widgets
      path: app/nice_view_custom_widgets # Đường dẫn phải khớp với thư mục bạn đã tạo
      # Không cần remote hoặc revision nếu nó nằm trong cùng repository
    # - name: nice-view-gem #new entry
    #   remote: cantruchd #new entry
    #   revision: main #new entry
  self:
    path: config
