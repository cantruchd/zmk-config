CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Chế độ idle (tắt backlight/display) sau 1 phút
CONFIG_ZMK_IDLE_TIMEOUT=60000

# Chế độ ngủ sâu sau 60 phút không hoạt động
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
#CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=180000

#enable soft off
CONFIG_ZMK_PM_SOFT_OFF=y


CONFIG_NICE_VIEW_WIDGET_INVERTED=y


CONFIG_ZMK_KEYBOARD_NAME="CH\'s SLK54"
CONFIG_USB_DEVICE_PRODUCT="CH\'s SLK54"
CONFIG_BT_DEVICE_NAME="CH\'s SLK54"



#enable mouse
CONFIG_ZMK_POINTING=y

#some battery saving config
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=n
CONFIG_BOARD_ENABLE_DCDC_HV=n


#increase bluetooth strength
# Set max transmit power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_PHY_2M=n

#test to see if external oscilator is dead
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
# it seems internal osc is dead, not external
# seems still ok after a reset, keeping this to test first

# Tune combos to allow proper Taipo support
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=128
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=10
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=10

#enable peripheral battery reporting
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

#thêm config để hiển thị temperature
CONFIG_ZMK_WIDGET_TEMPERATURE=y
CONFIG_SENSOR=y
CONFIG_TEMP_NRF5=y


############################ các config bluetooth tối ưu cho pin và kết nối ổn định ############################
# Connection Parameters - Tối ưu cho stability
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=15
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600

# Connection reliability
CONFIG_BT_CONN_TX_MAX=255

# Buffer sizes - Giảm packet loss
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_ACL_RX_COUNT=10

# MTU
CONFIG_BT_L2CAP_TX_MTU=247

# PHY 2M (Bluetooth 5.0)
CONFIG_BT_PHY_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=y