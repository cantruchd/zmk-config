
CONFIG_ZMK_KEYBOARD_NAME="BattMon Cell 1"
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_INF=y
CONFIG_SENSOR=y
CONFIG_TEMP_NRF5=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_BT_MAX_CONN=10
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6    
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12   
CONFIG_BT_PERIPHERAL_PREF_LATENCY=10   
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_CONN_TX_MAX=255
# Buffer sizes - giảm packet loss
CONFIG_BT_BUF_ACL_TX_SIZE=516
CONFIG_BT_BUF_ACL_RX_SIZE=516
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_ACL_RX_COUNT=10
# MTU size
CONFIG_BT_L2CAP_TX_MTU=512
# PHY 2M (Bluetooth 5.0) - ổn định hơn
CONFIG_BT_PHY_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=y

