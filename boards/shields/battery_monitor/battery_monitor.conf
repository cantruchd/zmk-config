# battery_monitor.conf
# ZMK Configuration for Battery Monitor Shield
# 
# Location: config/boards/shields/battery_monitor/battery_monitor.conf
#
# IMPORTANT: Change device name for second board!
#   Board #1 (Cell 1): "Battery Monitor Cell 1"
#   Board #2 (Cell 2): "Battery Monitor Cell 2"

# ============================================================================
# Device Identity
# ============================================================================
CONFIG_ZMK_KEYBOARD_NAME="BattMon Cell 1"

# For second nice!nano, change to:
# CONFIG_ZMK_KEYBOARD_NAME="BattMon Cell 2"
# 
# Note: BLE device name max length is 16 characters

# ============================================================================
# Bluetooth Configuration
# ============================================================================
CONFIG_BT=y
CONFIG_BT_CTLR=y

# Bluetooth TX power (maximum range)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Connection settings
# CONFIG_BT_MAX_CONN=1
# CONFIG_BT_MAX_PAIRED=5
# Allow multiple paired devices for easy re-pairing

# GATT settings
# CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# # Extended advertising for better compatibility
# CONFIG_BT_EXT_ADV=y

# ============================================================================
# Battery Reporting
# ============================================================================
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# Report battery level every 60 seconds

# # Enable Bluetooth Battery Service (BAS)
# CONFIG_BT_BAS=y

# ============================================================================
# Sensor Support (for temperature)
# ============================================================================
CONFIG_SENSOR=y
CONFIG_TEMP_NRF5=y

# ============================================================================
# Power Management
# ============================================================================
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
# Sleep after 30 minutes (1800000 ms)
# Adjust as needed:
#   300000 = 5 minutes
#   900000 = 15 minutes
#   3600000 = 1 hour

# CONFIG_PM=y
# CONFIG_PM_DEVICE=y

# ============================================================================
# USB Configuration
# ============================================================================
# CONFIG_ZMK_USB=y

# USB logging (disable in production to save power)
# # CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG=y
# CONFIG_ZMK_LOG_LEVEL_INF=y

# For debugging, enable these instead:
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG=y
# CONFIG_ZMK_LOG_LEVEL_DBG=y

# ============================================================================
# Features (disabled, not needed)
# ============================================================================
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_RGB_UNDERGLOW=n

# # ============================================================================
# # BLE Optimization
# # ============================================================================
# CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
# CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
# CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# # Security
# CONFIG_BT_CTLR_LE_ENC=y
# CONFIG_BT_CTLR_PRIVACY=y

# # Disable passkey entry (simplified pairing)
# CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# ============================================================================
# # Debouncing (not applicable, but required by ZMK)
# # ============================================================================
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5