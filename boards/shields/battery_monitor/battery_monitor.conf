# battery_monitor.conf
# ZMK Configuration for Battery Monitor Shield
# 
# Location: config/boards/shields/battery_monitor/battery_monitor.conf

# ============================================================================
# Device Identity
# ============================================================================
CONFIG_ZMK_KEYBOARD_NAME="Battery Monitor Cell 1"
# For second nice!nano, change to "Battery Monitor Cell 2"

# ============================================================================
# Bluetooth Configuration
# ============================================================================
CONFIG_BT=y
CONFIG_BT_CTLR=y

# Bluetooth TX power (maximum range)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Connection settings
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=5
# Allow 5 paired devices so you can re-pair from different phones
# without needing to clear bonds

# GATT settings
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
# More compatible with various BLE clients

# Extended advertising for better iOS/Android compatibility
CONFIG_BT_EXT_ADV=y

# ============================================================================
# Battery Reporting
# ============================================================================
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# Report battery level every 60 seconds

# Enable HID battery service (standard Bluetooth battery service)
CONFIG_BT_BAS=y

# ============================================================================
# Power Management
# ============================================================================
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
# Enter deep sleep after 30 minutes (1800000 ms = 30 min)
# Adjust this based on your needs:
# - 300000 = 5 minutes
# - 900000 = 15 minutes
# - 3600000 = 1 hour

# Power management
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# ============================================================================
# USB Configuration (for debugging and initial setup)
# ============================================================================
CONFIG_ZMK_USB=y

# USB logging (disable in production to save power)
CONFIG_ZMK_USB_LOGGING=n
CONFIG_LOG=n

# For debugging, enable these:
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG=y
# CONFIG_ZMK_LOG_LEVEL_DBG=y

# ============================================================================
# Display (not needed for this project)
# ============================================================================
CONFIG_ZMK_DISPLAY=n

# ============================================================================
# RGB Underglow (not needed)
# ============================================================================
CONFIG_ZMK_RGB_UNDERGLOW=n

# ============================================================================
# Debouncing (not applicable, no physical keys)
# ============================================================================
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# ============================================================================
# Additional Settings
# ============================================================================

# Increase BLE connection interval for power saving
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Settings for better battery life
CONFIG_BT_CTLR_LE_ENC=y
CONFIG_BT_CTLR_PRIVACY=y

# Optimizations
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n