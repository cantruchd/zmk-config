# battery_monitor.conf 
# ZMK Configuration for Battery Monitor Shield
# 
# Location: config/boards/shields/battery_monitor/battery_monitor.conf
#
# IMPORTANT: Change device name for second board!
#   Board #1 (Cell 1): "Battery Monitor Cell 1"
#   Board #2 (Cell 2): "Battery Monitor Cell 2"

# ============================================================================
# Device Identity
# ============================================================================


# For second nice!nano, change to:
# CONFIG_ZMK_KEYBOARD_NAME="BattMon Cell 2"
# 
# Note: BLE device name max length is 16 characters

# ============================================================================
# Bluetooth Configuration
# ============================================================================


# Connection settings
# CONFIG_BT_MAX_CONN=1
# CONFIG_BT_MAX_PAIRED=5
# Allow multiple paired devices for easy re-pairing

# GATT settings
# CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# # Extended advertising for better compatibility
# CONFIG_BT_EXT_ADV=y

# ============================================================================
# Battery Reporting
# ============================================================================

# Report battery level every 60 seconds

# # Enable Bluetooth Battery Service (BAS)
# CONFIG_BT_BAS=y

# ============================================================================
# Sensor Support (for temperature)
# ============================================================================

# ============================================================================
# Power Management
# ============================================================================

# Sleep after 30 minutes (1800000 ms)
# Adjust as needed:
#   300000 = 5 minutes
#   900000 = 15 minutes
#   3600000 = 1 hour

# CONFIG_PM=y
# CONFIG_PM_DEVICE=y

# ============================================================================
# USB Configuration
# ============================================================================
# CONFIG_ZMK_USB=y

# USB logging (disable in production to save power)
# # CONFIG_ZMK_USB_LOGGING=y


# For debugging, enable these instead:
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG=y
# CONFIG_ZMK_LOG_LEVEL_DBG=y

# ============================================================================
# Features (disabled, not needed)
# ============================================================================


# # ============================================================================
# # BLE Optimization
# # ============================================================================
# CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
# CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
# CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# # Security
# CONFIG_BT_CTLR_LE_ENC=y
# CONFIG_BT_CTLR_PRIVACY=y

# # Disable passkey entry (simplified pairing)
# CONFIG_ZMK_BLE_PASSKEY_ENTRY=n





CONFIG_ZMK_USB=y
CONFIG_PM=y
CONFIG_PM_DEVICE=y


CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_ATT_PREPARE_COUNT=3
CONFIG_ZMK_KEYBOARD_NAME="BattMon Cell 1"
CONFIG_BT=y
CONFIG_BT_CTLR=y


CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_INF=y
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_SENSOR=y
CONFIG_TEMP_NRF5=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y


# Connection settings
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6     # 7.5ms
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12    # 15ms
# CONFIG_BT_PERIPHERAL_PREF_LATENCY=30    # Có thể bỏ qua 30 lần
# CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=10000   # 4000ms = 4s (quá ngắn!)


# ============================================================================
# BLE CONNECTION STABILITY FIXES
# ============================================================================

# Tăng supervision timeout lên 6 giây (từ 4s mặc định)
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600

# Connection interval - giảm latency để reliable hơn
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6    
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12   

# Slave latency - giảm xuống để không bỏ qua quá nhiều events
CONFIG_BT_PERIPHERAL_PREF_LATENCY=10   

# Tăng TX power để tín hiệu mạnh hơn
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Tăng số lần retry khi gửi packet
CONFIG_BT_CONN_TX_MAX=255

# Buffer sizes - giảm packet loss
CONFIG_BT_BUF_ACL_TX_SIZE=516
CONFIG_BT_BUF_ACL_RX_SIZE=516
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_ACL_RX_COUNT=10

# MTU size
CONFIG_BT_L2CAP_TX_MTU=512

# PHY 2M (Bluetooth 5.0) - ổn định hơn
CONFIG_BT_PHY_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=y



